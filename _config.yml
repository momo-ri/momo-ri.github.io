# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# 웹페이지 언어 설정 (한국어)
lang: ko

# 시간대 설정 (한국 표준시)
timezone: Asia/Seoul

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 김태리 # 메인 타이틀

tagline: 태리's [세무사] 도전기 # 블로그 부제목

description: >- # SEO 및 RSS 피드용 설명
  CTA 세무사 시험합격 도전기 | 재무회계, 원가관리회계, 세법, 재정학 학습 일지 및 수험 기록

# 본인의 GitHub Pages 주소로 변경하세요. (예: 'https://username.github.io')
url: "https://your-username.github.io"

github:
  username: your_github_username # 본인의 GitHub 사용자명으로 변경

twitter:
  username: # 트위터를 사용하지 않는다면 비워두세요

social:
  # 작성자 이름 및 카피라이트 정보
  name: 김태리
  email: your_email@example.com # 본인 이메일 주소로 변경
  fediverse_handle: ""
  links:
    - https://github.com/your_github_username # 본인의 GitHub 주소
    # 추가하고 싶은 SNS나 포트폴리오 링크가 있다면 주석(#)을 해제하고 추가하세요.
    # - https://instagram.com/username

# 웹마스터 인증 설정 (필요시 구글/네이버 등록)
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: # 구글 애널리틱스 ID가 있다면 입력
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# 조회수 표시 설정
pageviews:
  provider:

# 테마 모드 설정 (시스템 기본값 / light / dark)
theme_mode: # [light | dark]

# 사이드바 프로필 이미지 경로
avatar: "/assets/img/avatar.jpg"

# SEO 대표 공유 이미지
social_preview_image:

# 포스트 내 목차(TOC) 기본 활성화 여부
toc: true

# 댓글 시스템 설정 (Giscus 권장)
comments:
  provider: # [disqus | utterances | giscus] 중 선택
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang: ko
    reactions_enabled:

# 정적 자원 설정
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# 한 페이지당 보여줄 게시글 수
paginate: 10

# 사이트 기본 URL (루트 도메인인 경우 비워둠)
baseurl: ""

# ------------ 이하 설정은 특별한 경우가 아니면 수정하지 않는 것을 권장합니다 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed
  load_paths:
    - _sass

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
